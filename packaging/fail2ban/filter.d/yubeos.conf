# fail2ban filter for the Yubeos login (docs/AUTHENTICATION.md §8).
# yubeosd writes one line per failed attempt:  yubeos-auth fail user=<name> ip=<client ip> reason=<reason>
# <HOST> is the real client address (proxy headers are only trusted from server.trustedProxies).
[Definition]
failregex = yubeos-auth fail user=\S* ip=<HOST> reason=(?:bad-credentials|no-linux-account|no-role|bad-current-password|bad-setup-token)
ignoreregex =
