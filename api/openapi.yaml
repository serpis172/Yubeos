openapi: 3.1.0
info:
  title: Yubeos API
  version: 0.1.0
  description: 'Source of truth for the Yubeos HTTP contract. Phase 0 contains the foundation endpoints;

    every later phase adds its paths here BEFORE implementation (see docs/ROADMAP.md).

    Conventions: docs/API.md.

    '
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost:8443
security:
- sessionCookie: []
- bearerToken: []
tags:
- name: system
- name: auth
- name: jobs
- name: security
- name: audit
- name: me
- name: metrics
- name: addons
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Served at the server root (not under /api/v1).
    servers:
    - url: https://{host}
      variables:
        host:
          default: localhost:8443
  /system/info:
    get:
      tags:
      - system
      summary: Host information, tool versions and detected capabilities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/login:
    post:
      tags:
      - auth
      summary: 'First factor: Yubeos password. Returns a session, or 202 with a second-factor challenge'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created (cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '202':
          description: Second factor required (skipped automatically when a valid trusted-device cookie is presented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondFactorChallenge'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /auth/me:
    get:
      tags:
      - auth
      summary: Current user, role and CSRF token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /jobs/{id}:
    get:
      tags:
      - jobs
      summary: Job status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/2fa/verify:
    post:
      tags:
      - auth
      summary: Complete login with TOTP or a recovery code
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
      security: []
  /auth/webauthn/login/begin:
    post:
      tags:
      - auth
      summary: Start passkey login (usernameless or for a named user)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnChallenge'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginBegin'
  /auth/webauthn/login/finish:
    post:
      tags:
      - auth
      summary: Finish passkey login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginFinish'
  /auth/webauthn/register/begin:
    post:
      tags:
      - auth
      summary: Start registering a passkey for the current user (fresh 2FA required)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnChallenge'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/webauthn/register/finish:
    post:
      tags:
      - auth
      summary: Finish passkey registration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegisterFinish'
  /auth/totp/enroll:
    post:
      tags:
      - auth
      summary: Create a TOTP secret and provisioning URI (not active until confirmed)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/totp/confirm:
    post:
      tags:
      - auth
      summary: Confirm TOTP enrollment with a code; returns recovery codes once
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
  /auth/stepup:
    post:
      tags:
      - auth
      summary: Fresh second-factor check opening a 5-minute step-up window
      responses:
        '204':
          description: Step-up window opened
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorRequest'
  /auth/password:
    put:
      tags:
      - auth
      summary: Change own password (step-up required)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
  /auth/devices:
    get:
      tags:
      - auth
      summary: List trusted devices and active sessions of the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/devices/{id}:
    delete:
      tags:
      - auth
      summary: Revoke a trusted device or session
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /auth/devices:revokeAll:
    post:
      tags:
      - auth
      summary: Sign out everywhere and forget all trusted devices
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - auth
      summary: End the current session
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Problem'
  /auth/setup:
    post:
      tags:
      - auth
      summary: 'Consume a one-time setup link (local origin only): set the first password'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Problem'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
  /auth/tokens:
    get:
      tags:
      - auth
      summary: List own API tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - auth
      summary: Create an API token (step-up required; token shown once)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '401':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
  /auth/tokens/{id}:
    delete:
      tags:
      - auth
      summary: Revoke an API token
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /auth/recovery-codes:regenerate:
    post:
      tags:
      - auth
      summary: Regenerate recovery codes (step-up; invalidates old codes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/totp:
    delete:
      tags:
      - auth
      summary: Remove TOTP (step-up)
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
  /auth/webauthn/{id}:
    delete:
      tags:
      - auth
      summary: Remove a passkey (step-up)
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /security/remote-status:
    get:
      tags:
      - security
      summary: Remote-access readiness checklist (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteStatus'
        '401':
          $ref: '#/components/responses/Problem'
  /security/lockdown:
    post:
      tags:
      - security
      summary: Deny all remote origins immediately (admin, step-up)
      responses:
        '204':
          description: Applied
        '401':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockdownRequest'
  /jobs:
    get:
      tags:
      - jobs
      summary: List jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        schema:
          type: string
  /jobs/{id}/cancel:
    post:
      tags:
      - jobs
      summary: Request cancellation of a job
      responses:
        '202':
          description: Cancellation requested
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /audit:
    get:
      tags:
      - audit
      summary: Audit log (admin); format=ndjson for export
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: from
        in: query
        schema:
          type: string
      - name: to
        in: query
        schema:
          type: string
      - name: actor
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: format
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
  /auth/stepup/begin:
    post:
      tags:
      - auth
      summary: 'Start a step-up: lists the usable methods and, for passkeys, the assertion options'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnChallenge'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/factors:
    get:
      tags:
      - auth
      summary: Second-factor overview of the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factors'
        '401':
          $ref: '#/components/responses/Problem'
  /me/preferences:
    get:
      tags:
      - me
      summary: Interface preferences of the current user (defaults when never saved)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      tags:
      - me
      summary: Replace the preferences (validated; at most 128 KiB)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Invalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
  /metrics/catalog:
    get:
      tags:
      - metrics
      summary: Series, devices and provider health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricCatalog'
        '401':
          $ref: '#/components/responses/Problem'
  /metrics/snapshot:
    get:
      tags:
      - metrics
      summary: Latest value of every series
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSnapshot'
        '401':
          $ref: '#/components/responses/Problem'
  /metrics/history:
    get:
      tags:
      - metrics
      summary: History of series (ring buffer up to 1 h, minute rollups beyond)
      parameters:
      - name: series
        in: query
        required: true
        schema:
          type: string
        description: Comma separated keys or prefix.* patterns, at most 64
      - name: range
        in: query
        required: true
        schema:
          type: string
          enum:
          - 5m
          - 1h
          - 24h
          - 7d
          - 30d
      - name: step
        in: query
        required: false
        schema:
          type: integer
        description: Bucket size in seconds (default depends on the range)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricHistory'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /addons:
    get:
      operationId: listAddons
      tags:
      - addons
      summary: List installed add-ons
      responses:
        '200':
          description: Installed add-ons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonList'
        '401':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yubeos_session
      description: Browser sessions also require the X-Yubeos-CSRF header on non-GET requests.
    bearerToken:
      type: http
      scheme: bearer
      description: API token (yb_...)
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Forbidden (role, step-up required, or origin policy)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Invalid:
      description: Validation error (see errors[])
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests / locked out / IP banned
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - pointer
            - message
            properties:
              pointer:
                type: string
              message:
                type: string
        requestId:
          type: string
          description: Mirrors the X-Request-Id response header
    LoginRequest:
      type: object
      required:
      - username
      - password
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 1024
        deviceHint:
          type: string
          maxLength: 60
          description: Optional label suggested for 'remember this device'
    Me:
      type: object
      required:
      - username
      - role
      - csrf
      properties:
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
        csrf:
          type: string
        totpEnabled:
          type: boolean
        factors:
          type: array
          items:
            type: string
            enum:
            - password
            - passkey
            - totp
            - recovery
            - device
        trustedDevice:
          type: boolean
        remoteSession:
          type: boolean
          description: Session originates from a non-local address
        enrollmentRequired:
          type: boolean
          description: Session may only enrol a second factor (policy requires one and none is set up)
    SystemInfo:
      type: object
      required:
      - hostname
      - version
      - demoMode
      - capabilities
      properties:
        hostname:
          type: string
        version:
          type: string
        demoMode:
          type: boolean
        uptimeSeconds:
          type: integer
        os:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
            kernel:
              type: string
        versions:
          type: object
          additionalProperties:
            type: string
          description: zfs, smartctl, samba, docker, compose, nvidia-smi ...
        capabilities:
          type: object
          additionalProperties:
            type: boolean
    Job:
      type: object
      required:
      - id
      - kind
      - state
      properties:
        id:
          type: string
        kind:
          type: string
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        progress:
          type: number
          minimum: 0
          maximum: 1
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    SecondFactorChallenge:
      type: object
      required:
      - needs2fa
      - methods
      properties:
        needs2fa:
          type: boolean
        methods:
          type: array
          items:
            type: string
            enum:
            - webauthn
            - totp
            - recovery
        challengeId:
          type: string
          description: Opaque, single-use, expires in 5 minutes
        enrollmentRequired:
          type: boolean
          description: True when policy demands 2FA but the user has none yet; only possible from a local network
    SecondFactorRequest:
      type: object
      required:
      - method
      additionalProperties: false
      properties:
        challengeId:
          type: string
        method:
          type: string
          enum:
          - totp
          - recovery
          - webauthn
          - password
        code:
          type: string
          maxLength: 32
        trustDevice:
          type: boolean
          description: Remember this device (skips TOTP prompt for auth.trustedDeviceDays)
        deviceLabel:
          type: string
          maxLength: 60
        password:
          type: string
          description: Step-up only, and only for accounts with no second factor enrolled
        credential:
          type: object
          additionalProperties: true
          description: Browser PublicKeyCredential JSON (method webauthn)
    TotpConfirmRequest:
      type: object
      required:
      - code
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    PasswordChangeRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
    TotpEnrollResponse:
      type: object
      required:
      - secret
      - otpauthUri
      properties:
        secret:
          type: string
        otpauthUri:
          type: string
    RecoveryCodes:
      type: object
      required:
      - codes
      properties:
        codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
    Device:
      type: object
      required:
      - id
      - kind
      - label
      - createdAt
      - lastUsedAt
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - trusted-device
          - session
        label:
          type: string
        browser:
          type: string
        os:
          type: string
        lastIp:
          type: string
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    DeviceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    ApiToken:
      type: object
      required:
      - id
      - name
      - scopes
      - expiresAt
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - read
            - files
            - admin
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    ApiTokenCreate:
      type: object
      required:
      - name
      - scopes
      - expiresInDays
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 60
        scopes:
          type: array
          items:
            type: string
            enum:
            - read
            - files
            - admin
          minItems: 1
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
    ApiTokenCreated:
      allOf:
      - $ref: '#/components/schemas/ApiToken'
      - type: object
        required:
        - token
        properties:
          token:
            type: string
            description: Shown once
    SetupRequest:
      type: object
      required:
      - token
      - newPassword
      additionalProperties: false
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
    RemoteStatus:
      type: object
      required:
      - exposure
      - checks
      properties:
        exposure:
          type: string
          enum:
          - lan
          - remote
        lockdown:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required:
            - id
            - status
            - title
            properties:
              id:
                type: string
              status:
                type: string
                enum:
                - ok
                - warn
                - fail
              title:
                type: string
              detail:
                type: string
    LockdownRequest:
      type: object
      required:
      - enabled
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    JobList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        nextCursor:
          type:
          - string
          - 'null'
    AuditEntry:
      type: object
      required:
      - id
      - ts
      - action
      - result
      properties:
        id:
          type: integer
        ts:
          type: string
          format: date-time
        actor:
          type: string
        role:
          type: string
        ip:
          type: string
        reqId:
          type: string
        action:
          type: string
        target:
          type: string
        result:
          type: string
          enum:
          - ok
          - fail
          - denied
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type:
          - string
          - 'null'
    WebAuthnOptions:
      type: object
      description: WebAuthn PublicKeyCredential{Creation,Request}Options as produced by the server library
      additionalProperties: true
    WebAuthnAssertion:
      type: object
      description: Browser PublicKeyCredential JSON (attestation or assertion)
      additionalProperties: true
    WebAuthnChallenge:
      type: object
      required:
      - challengeId
      properties:
        challengeId:
          type: string
          description: Opaque, single-use, expires in 5 minutes
        methods:
          type: array
          items:
            type: string
        webauthn:
          $ref: '#/components/schemas/WebAuthnOptions'
          description: Present only when the user has a passkey
        expiresAt:
          type: string
          format: date-time
    Passkey:
      type: object
      required:
      - id
      - label
      - createdAt
      - flagged
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        flagged:
          type: boolean
          description: 'Signature-counter regression seen: this passkey is refused until removed'
    Factors:
      type: object
      required:
      - totp
      - passkeys
      - recoveryCodesLeft
      - required
      properties:
        totp:
          type: boolean
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
        recoveryCodesLeft:
          type: integer
        required:
          type: boolean
          description: Policy demands a second factor for this user and origin
    WebAuthnLoginBegin:
      type: object
      properties:
        challengeId:
          type: string
          description: 'From the 202 login response: ask for options bound to that user. Omit for a usernameless passkey login.'
    WebAuthnLoginFinish:
      type: object
      required:
      - challengeId
      - credential
      properties:
        challengeId:
          type: string
        trustDevice:
          type: boolean
        credential:
          $ref: '#/components/schemas/WebAuthnAssertion'
    WebAuthnRegisterFinish:
      type: object
      required:
      - challengeId
      - credential
      properties:
        challengeId:
          type: string
        label:
          type: string
        credential:
          $ref: '#/components/schemas/WebAuthnAssertion'
    Preferences:
      type: object
      required:
      - theme
      - language
      - units
      - temperature
      - customThemes
      - updatedAt
      properties:
        theme:
          type: string
          description: system | preset id | custom:<id>
        language:
          type: string
          enum:
          - en
          - it
        units:
          type: string
          enum:
          - bytes
          - bits
          description: Network rates in bytes/s or bits/s
        temperature:
          type: string
          enum:
          - c
          - f
        customThemes:
          type: array
          items:
            type: object
            additionalProperties: true
        updatedAt:
          type: integer
          format: int64
          description: Unix ms of the last save; 0 = nothing saved yet
    MetricSeries:
      type: object
      required:
      - key
      - label
      - unit
      - group
      - device
      - stale
      properties:
        key:
          type: string
          example: cpu.0.util
        label:
          type: string
        unit:
          type: string
          enum:
          - percent
          - celsius
          - bytes
          - bytes/s
          - bit/s
          - watt
          - hertz
          - count
          - count/s
          - load
          - seconds
        group:
          type: string
          enum:
          - cpu
          - mem
          - net
          - gpu
          - disk
          - sys
        device:
          type: string
        stale:
          type: boolean
          description: No value for more than 5 seconds
    MetricDevice:
      type: object
      required:
      - kind
      - id
      - label
      properties:
        kind:
          type: string
          enum:
          - cpu
          - net
          - gpu
          - disk
        id:
          type: string
        label:
          type: string
        hidden:
          type: boolean
          description: 'Virtual interface etc.: collected but not shown by default'
        props:
          type: object
          additionalProperties: true
    MetricProvider:
      type: object
      required:
      - name
      - ok
      properties:
        name:
          type: string
        ok:
          type: boolean
        reason:
          type: string
    MetricCatalog:
      type: object
      required:
      - series
      - devices
      - providers
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/MetricDevice'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/MetricProvider'
    MetricSnapshot:
      type: object
      required:
      - t
      - values
      - stale
      properties:
        t:
          type: integer
          format: int64
        values:
          type: object
          additionalProperties:
            type: number
        stale:
          type: array
          items:
            type: string
    MetricHistory:
      type: object
      required:
      - range
      - stepSeconds
      - series
      properties:
        range:
          type: string
          enum:
          - 5m
          - 1h
          - 24h
          - 7d
          - 30d
        stepSeconds:
          type: number
        series:
          type: object
          additionalProperties:
            type: object
            required:
            - t
            - v
            properties:
              t:
                type: array
                items:
                  type: number
              v:
                type: array
                items:
                  type: number
    Addon:
      type: object
      required:
      - id
      - name
      - state
      - embed
      - sidebar
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        icon:
          type: string
        categories:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
          - running
          - stopped
          - starting
          - unhealthy
          - unknown
        embed:
          type: string
          enum:
          - iframe
          - link
          - none
        sidebar:
          type: boolean
        url:
          type: string
          description: Safe URL to open in a new tab (ADR-0018); absent when there is none or it is blocked
        urlBlocked:
          type: string
          description: 'Why no safe link exists: same-host, no-port, no-alternate-address'
    AddonList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Addon'
        unavailable:
          type: boolean
          description: The container runtime could not be queried
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
      description: De-duplicates retried POSTs for 24 h
