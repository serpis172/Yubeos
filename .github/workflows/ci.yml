name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: run scripts/pin-actions.sh once on a networked machine to pin these tags to commit SHAs.
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: true }
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web)"
      - name: go.mod/go.sum are tidy and committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./cmd/... ./internal/... ./web
      # Race detector and coverage run separately: instrumenting both over the whole tree (incl. the huge pure-Go
      # SQLite driver) is slow and was the most fragile step. -coverpkg limits coverage to first-party code.
      - run: go test -race -count=1 ./cmd/... ./internal/... ./web
      - run: go test -count=1 -coverpkg=./cmd/...,./internal/... -coverprofile=coverage.out ./cmd/... ./internal/...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/... ./web
      - name: build (static) + cross-build arm64
        run: |
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/yubeosd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/yubeosd

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, cache: true }
      - name: build binaries (web UI not needed for the API smoke test)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -o dist/ ./cmd/yubeosd ./cmd/yubeos-priv ./cmd/yubeosctl
      - name: auth smoke test (real helper as root, daemon unprivileged, real users)
        run: sudo -E bash test/e2e/auth-smoke.sh dist

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: generated API client is up to date
        run: |
          npm run gen
          git diff --exit-code src/lib/api.gen.ts
      - run: npm audit --audit-level=high --omit=dev

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pyyaml
      - run: python3 scripts/validate-schemas.py
      - name: OpenAPI lint (Redocly)
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml --skip-rule=no-empty-servers

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: every commit must carry a Signed-off-by line (git commit -s)
        run: |
          missing=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $c has no Signed-off-by"; missing=1
            fi
          done
          exit $missing
